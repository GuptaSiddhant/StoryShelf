name: Setup workspace
description: Install nub and pnpm, then the monorepo dependencies. Run after checkout.

runs:
  using: composite
  steps:
    - name: Setup Nub
      uses: nubjs/setup-nub@v0

    - name: Setup pnpm
      # Fixtures are independent pnpm installs, not nub workspaces.
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Install dependencies
      shell: bash
      run: nub ci
