name: Setup workspace
description: Install nub and pnpm, the monorepo dependencies, and restore the turbo task cache. Run after checkout.

runs:
  using: composite
  steps:
    - name: Setup Nub
      uses: nubjs/setup-nub@v0
      with:
        # Pinned (#782, now 0.10.0): exact, so no job drifts to a new nub. protobufjs's build script is denied in package.json `allowScripts`.
        nub-version: "0.10.0"

    - name: Setup pnpm
      # Fixtures are independent pnpm installs, not nub workspaces.
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Install dependencies
      shell: bash
      run: nub ci

    # Turbo's local task cache (.turbo/cache), restored from the newest cache `main` saved.
    # Pull requests only restore; the `verify` job on `main` saves it (save-turbo-cache), so
    # open PRs never fill the repository's cache quota with entries nobody else can read.
    - name: Restore turbo cache
      uses: actions/cache/restore@v4
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-

    # Marks the start of this job's own turbo work: save-turbo-cache keeps only cache
    # entries written after this point, so the saved cache never accumulates old runs.
    - name: Mark turbo cache start
      shell: bash
      run: mkdir -p .turbo/cache && touch .turbo/run-start
