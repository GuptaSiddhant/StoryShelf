# Dogfood: upload the app's own Storybook (packages/app) to the demo deployment the way a customer's
# pipeline would, so the demo shows real baselines, diffs and review for StoryShelf's own UI.
#
# Customer path on purpose: the Storybook is built with its own script and uploaded with the
# PUBLISHED CLI from npm (not packages/cli/dist). The server URL and project slug live in
# packages/app/.storybook/storyshelf.json, like a customer's committed config; only the project's CI
# token comes from the environment. The Fly demo seed (apps/fly-app, fixtures/storybook-9) is a
# separate thing and unchanged. Independent of ci.yml, fly.yml and release.yml.
name: app-storybook

on:
  push:
    branches: [main]
  pull_request:
    paths:
      # The Storybook bundles code from these workspace packages, so a change to one can change a story.
      - "packages/app/**"
      - "packages/core/**"
      - "packages/image/**"
      - "packages/affected/**"
      - ".github/workflows/app-storybook.yml"

# One upload per ref at a time: a newer push cancels an older PR upload, never one on main.
concurrency:
  group: app-storybook-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  upload:
    name: upload to storyshelf-ui
    runs-on: ubuntu-latest
    env:
      STORYSHELF_TOKEN: ${{ secrets.STORYSHELF_UI_TOKEN }}
    steps:
      # Fork PRs get no secrets and a missing token is a setup gap, not a failure: skip with a notice.
      - name: Check this run can upload
        id: gate
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$IS_FORK" = "true" ]; then
            echo "::notice title=Skipped::Fork pull requests have no secrets, so the Storybook is not uploaded to the demo."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$STORYSHELF_TOKEN" ]; then
            echo "::notice title=Skipped::STORYSHELF_UI_TOKEN is not set, so the Storybook is not uploaded to the demo."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          # The PR head, not the merge commit, so the demo shows the PR's own revision.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Affected capture diffs against the baseline revision, which needs the history.
          fetch-depth: 0

      - name: Setup workspace
        if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/setup-workspace

      # Workspace dependencies only; a customer's come from npm. Then the Storybook itself,
      # built with its own script (which passes --stats-json for affected capture).
      - name: Build workspace dependencies
        if: steps.gate.outputs.run == 'true'
        run: nubx turbo run build --filter='@storyshelf/app^...'

      - name: Build Storybook
        if: steps.gate.outputs.run == 'true'
        working-directory: packages/app
        run: nub run build-storybook

      # `doctor` reports a shallow clone or missing stats as a warning (!), and a failed check as ✗
      # (it also exits 1 for those). A customer's upload still works after a warning, rendering
      # everything; our own pipeline is strict: any ! or ✗ line fails the job. `shell: bash` adds
      # pipefail, so doctor's own exit status is not swallowed by the pipe to tee.
      - name: Check the upload would succeed
        if: steps.gate.outputs.run == 'true'
        shell: bash
        working-directory: packages/app
        run: |
          npx --yes storyshelf@latest doctor | tee doctor.log
          if grep -qE '^(!|✗)' doctor.log; then
            echo "::error title=storyshelf doctor::doctor reported a warning or a failed check; see the log."
            exit 1
          fi

      # Branch and SHA are passed explicitly: on pull_request the environment's GITHUB_SHA and
      # GITHUB_REF_NAME are the merge commit and "<n>/merge", not the PR head and its branch.
      # Values come through env, never inline in the script (a branch name is user input).
      #
      # The result goes to the job summary: whether affected capture ran (and how many stories it
      # renders) or fell back to a full capture, and the build's page on the demo. The server URL
      # and slug come from storyshelf.json, so they are not repeated here.
      - name: Upload to StoryShelf
        if: steps.gate.outputs.run == 'true'
        shell: bash
        working-directory: packages/app
        env:
          UPLOAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          UPLOAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # The Storybook imports the workspace packages through their built dist, so the module
          # graph cannot match a changed packages/*/src file to a story. When one of them changed,
          # render everything; a change confined to packages/app is traced.
          mode=""
          if [ -z "$DIFF_BASE" ] || git diff --name-only "$DIFF_BASE" "$UPLOAD_SHA" -- packages/core packages/image packages/affected | grep -q .; then
            mode="--full"
          fi
          # shellcheck disable=SC2086
          npx --yes storyshelf@latest upload --sha "$UPLOAD_SHA" --branch "$UPLOAD_BRANCH" $mode | tee upload.log
          build=$(grep -oE 'Build created: [0-9A-Z]+' upload.log | awk '{print $3}')
          base=$(jq -r .url .storybook/storyshelf.json)
          slug=$(jq -r .slug .storybook/storyshelf.json)
          {
            echo "### Demo upload"
            grep -E 'Affected capture|Full capture' upload.log || echo "No capture-mode line in the upload output."
            echo "Build: ${base}/projects/${slug}/builds/${build}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
