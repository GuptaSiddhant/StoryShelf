# Turns on GitHub auto-merge for every pull request opened from a branch of this repository
# (owner decision, 2026-11-08; AGENTS.md "Agent operating model"). GitHub then merges it once the
# required checks (`ci`, `changeset`) pass and every review conversation is resolved, and
# pr-autoupdate.yml keeps the queue up to date with `main`.
#
# GitHub refuses to enable auto-merge in two cases, and this workflow handles both (#1416):
# - "clean status": the PR is already mergeable (it left draft after its checks went green), so
#   there is nothing to wait for and it is merged through the REST endpoint;
# - "unstable status": a check that is not required (our own `storyshelf/testing`, which stays
#   pending until someone reviews it on the demo) is pending or failing. The workflow retries on
#   `workflow_run` when CI or Changeset completes, and merges once `ci` and `changeset` are green,
#   the branch is up to date and every review thread is resolved.
# A failing or pending required check, or an unresolved thread, is never merged over.
#
# Excluded, so they still need a person:
# - pull requests from forks: anyone can open one, and the ruleset requires no approval;
# - drafts, until they are marked ready for review;
# - `release/v*` pull requests: only the owner merges a release (ADR 0043).
#
# An epic branch into `main` merges with a merge commit, so each task commit survives; everything
# else is squashed. No job checks out or runs pull request code, so pull_request_target and
# workflow_run (both run with a write token from the default branch) are safe; the workflow_run
# path reads only the PR's metadata, check runs and review threads through the API.
#
# Uses AUTOUPDATE_TOKEN when it is set (see pr-autoupdate.yml), so enabling auto-merge also wakes
# pr-autoupdate; with GITHUB_TOKEN the queue still moves on the next push to `main`.
name: auto-merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
    branches: [main, "epic/**"]
  # Retry once the required checks finish: the workflows that produce `ci` and `changeset`.
  workflow_run:
    workflows: [CI, Changeset]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

# One run at a time per commit (or PR), so the two workflow_run events for the same commit cannot
# race to merge, while a newer event for another PR never replaces this PR's pending retry.
concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable:
    # A fork's pull_request_target is skipped here; the script rechecks every PR it finds for
    # workflow_run, which carries no PR payload.
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      !startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ secrets.AUTOUPDATE_TOKEN || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const REQUIRED = ["ci", "changeset"];

            // Pull requests this event is about. A workflow_run names its commit, not a payload PR.
            async function candidates() {
              if (context.eventName === "pull_request_target") {
                return [context.payload.pull_request.number];
              }
              const run = context.payload.workflow_run;
              if (run.event !== "pull_request" && run.event !== "pull_request_target") return [];
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: run.head_sha,
              });
              return data
                .filter((pr) => pr.state === "open" && pr.head.sha === run.head_sha)
                .map((pr) => pr.number);
            }

            // Every exclusion lives here, on fresh data: forks, drafts, release PRs, other bases.
            function eligible(pr) {
              const base = pr.base.ref;
              return (
                pr.state === "open" &&
                !pr.draft &&
                pr.head.repo?.full_name === `${owner}/${repo}` &&
                !pr.head.ref.startsWith("release/") &&
                (base === "main" || base.startsWith("epic/"))
              );
            }

            // Every review thread, page by page: a gate that saw only the first page could pass.
            async function unresolvedThreads(number) {
              let open = 0;
              let after = null;
              for (;;) {
                const { repository } = await github.graphql(
                  `query ($owner: String!, $repo: String!, $number: Int!, $after: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100, after: $after) {
                          nodes { isResolved }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                    }
                  }`,
                  { owner, repo, number, after },
                );
                const { nodes, pageInfo } = repository.pullRequest.reviewThreads;
                open += nodes.filter((t) => !t.isResolved).length;
                if (!pageInfo.hasNextPage) return open;
                after = pageInfo.endCursor;
              }
            }

            // Required checks green, branch up to date, no open thread: only then is a merge safe
            // while a check that is not required is still pending or failing.
            async function safeToMerge(pr) {
              const checks = await github.paginate(github.rest.checks.listForRef, {
                owner, repo, ref: pr.head.sha, per_page: 100,
              });
              const latest = new Map();
              for (const run of checks) {
                const seen = latest.get(run.name);
                if (!seen || run.id > seen.id) latest.set(run.name, run);
              }
              const red = REQUIRED.filter((name) => {
                const run = latest.get(name);
                return !run || run.status !== "completed" || run.conclusion !== "success";
              });
              if (red.length > 0) return `required check(s) not green yet: ${red.join(", ")}`;
              const { data: cmp } = await github.rest.repos.compareCommits({
                owner, repo, base: pr.base.ref, head: pr.head.sha,
              });
              if (cmp.behind_by > 0) return `${cmp.behind_by} commit(s) behind ${pr.base.ref}`;
              const open = await unresolvedThreads(pr.number);
              if (open > 0) return `${open} unresolved review thread(s)`;
              return null;
            }

            async function mergeNow(pr, mergeMethod) {
              try {
                await github.rest.pulls.merge({
                  owner, repo, pull_number: pr.number, sha: pr.head.sha,
                  merge_method: mergeMethod.toLowerCase(),
                });
                core.info(`#${pr.number} merged (${mergeMethod.toLowerCase()}).`);
              } catch (error) {
                // The ruleset is the last word: a refused merge is a warning, never a bypass.
                core.warning(`#${pr.number}: merge refused: ${error.message}`);
              }
            }

            async function settle(number) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (!eligible(pr)) {
                core.info(`#${number}: excluded (fork, draft, release, closed or other base).`);
                return;
              }
              if (pr.auto_merge) {
                core.info(`#${number}: auto-merge already enabled.`);
                return;
              }
              const epicIntoMain = pr.head.ref.startsWith("epic/") && pr.base.ref === "main";
              const mergeMethod = epicIntoMain ? "MERGE" : "SQUASH";
              try {
                // `method` is reserved by @octokit/graphql, so the variable is `mergeMethod`.
                await github.graphql(
                  `mutation ($pullRequestId: ID!, $mergeMethod: PullRequestMergeMethod!) {
                    enablePullRequestAutoMerge(
                      input: { pullRequestId: $pullRequestId, mergeMethod: $mergeMethod }
                    ) {
                      clientMutationId
                    }
                  }`,
                  { pullRequestId: pr.node_id, mergeMethod },
                );
                core.info(`Auto-merge (${mergeMethod.toLowerCase()}) enabled on #${number}.`);
              } catch (error) {
                if (/already enabled/iu.test(error.message)) {
                  core.notice(`#${number}: ${error.message}`);
                } else if (/clean status|unstable status/iu.test(error.message)) {
                  // Clean: already mergeable, nothing to wait for. Unstable: only checks that are
                  // not required (`storyshelf/testing`) can still be pending or failing, so merge
                  // when the required ones are green. A red `enable` check would itself keep the PR
                  // unstable, so none of this fails the run.
                  const why = await safeToMerge(pr);
                  if (why) {
                    core.warning(`#${number}: not merged yet: ${why}.`);
                  } else {
                    await mergeNow(pr, mergeMethod);
                  }
                } else {
                  core.setFailed(`#${number}: auto-merge not enabled: ${error.message}`);
                }
              }
            }

            for (const number of await candidates()) {
              await settle(number);
            }
