name: CI

# One job: verify, smoke, docs checks and the real-browser capture tests share a
# single install/build/Chromium. Only the Storybook 8 fixture runs for now
# (fixtures/storybook-9 and -10 are skipped; re-add them as steps below).
#
# Node: the whole job runs on the version `setup-nub` resolves from
# package.json#devEngines.runtime (24.x, the minimum supported Node) — there is
# no separate Node setup step.
#
# Website: the docs build, link check and accessibility check run only when
# apps/website/ changed (scheduled and manual runs always run them).
on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    # Nightly drift check (Storybook/pnpm/Playwright move fast).
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 2 is enough to diff a PR's merge commit against its base, or a push
          # against its parent, for the website change check below.
          fetch-depth: 2

      - name: Detect website changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          website=true
          case "$EVENT" in
            pull_request)
              # HEAD is the PR merge commit: first parent is the base branch tip.
              git diff --name-only HEAD^1 HEAD > changed.txt || rm -f changed.txt
              ;;
            push)
              git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null \
                && git diff --name-only "$BEFORE" HEAD > changed.txt || rm -f changed.txt
              ;;
          esac
          # Anything else (schedule, manual run, or a diff that failed) runs everything.
          if [ -f changed.txt ]; then
            if grep -qE '^apps/website/' changed.txt; then website=true; else website=false; fi
            echo "changed files:"; cat changed.txt
          fi
          echo "website=$website" >> "$GITHUB_OUTPUT"
          if [ "$website" = "true" ]; then
            echo "verify_args=" >> "$GITHUB_OUTPUT"
          else
            echo "verify_args=--filter=!website" >> "$GITHUB_OUTPUT"
            echo "apps/website/ unchanged: skipping the website build and its checks"
          fi

      - name: Setup Nub
        uses: nubjs/setup-nub@v0

      - name: Setup pnpm
        # Fixtures are independent pnpm installs, not nub workspaces.
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: nub ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium-${{ runner.os }}

      - name: Install Playwright chromium
        # Shared by the docs accessibility check and the capture tests. System
        # libraries are installed (apt, ~15s) only when chromium cannot launch.
        working-directory: packages/runner-playwright
        run: |
          nubx playwright-core install chromium
          if ! node --input-type=module -e "const { chromium } = await import('playwright-core'); await (await chromium.launch()).close()"; then
            echo "chromium failed to launch; installing system dependencies"
            nubx playwright-core install-deps chromium
          fi

      - name: Verify (build + lint + test)
        run: nubx turbo verify --force ${{ steps.changes.outputs.verify_args }}

      - name: App smoke test (boot once, curl health/API/HTML/htmx)
        if: ${{ !cancelled() }}
        run: bash scripts/smoke.sh

      - name: Built-artifact smoke (CLI via .bin symlink, scaffolded server boots)
        # The CLI and every package are built by the verify step. Scaffolds a
        # server, type-checks it, boots it and checks it serves and shuts down.
        if: ${{ !cancelled() }}
        working-directory: packages/cli
        env:
          RUN_SMOKE: "1"
          # Fails if the pipeline's default Node ever drifts off the minimum.
          SMOKE_NODE_MAJOR: "24"
        run: nubx vitest run src/smoke.integration.test.ts

      - name: Check website links
        # dist/ is already built by website#verify (dependsOn build) above.
        if: ${{ !cancelled() && steps.changes.outputs.website == 'true' }}
        working-directory: apps/website
        run: nub run check:links

      - name: Check website accessibility (axe, light/dark/mobile)
        if: ${{ !cancelled() && steps.changes.outputs.website == 'true' }}
        working-directory: apps/website
        run: nub run check:a11y

      - name: Get pnpm store path
        id: pnpm-store
        if: ${{ !cancelled() }}
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-storybook-8-${{ hashFiles('fixtures/storybook-8/pnpm-lock.yaml') }}

      - name: Install fixture (storybook-8)
        if: ${{ !cancelled() }}
        run: pnpm --dir fixtures/storybook-8 install --frozen-lockfile

      - name: Build fixture Storybook (storybook-8)
        if: ${{ !cancelled() }}
        run: pnpm --dir fixtures/storybook-8 run build-storybook

      - name: Real-browser capture tests (storybook-8)
        # Workspace packages are already built by the verify step.
        if: ${{ !cancelled() }}
        working-directory: packages/runner-playwright
        env:
          # Absolute: cwd-independent. Must flow via `nub run` (step env does
          # not survive `nubx turbo`).
          FIXTURE_DIR: ${{ github.workspace }}/fixtures/storybook-8
          RUN_INTEGRATION: "1"
        run: nub run test:integration
