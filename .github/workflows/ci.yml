name: CI

# `verify` runs build/lint/test, smoke and docs checks; `capture` is a matrix of
# real-browser capture tests, one leg per Storybook fixture (8, 9, 10); `fly` is the
# deploy dry run: it builds the Fly image, boots it and runs the demo seed against it.
#
# Node: the whole job runs on the version `setup-nub` resolves from
# package.json#devEngines.runtime (24.x, the minimum supported Node) — there is
# no separate Node setup step.
#
# Website: the docs build, link check and accessibility check run only when
# apps/website/ changed (scheduled and manual runs always run them).
on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    # Nightly drift check (Storybook/pnpm/Playwright move fast).
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 2 is enough to diff a PR's merge commit against its base, or a push
          # against its parent, for the website change check below.
          fetch-depth: 2

      - name: Detect website changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          website=true
          case "$EVENT" in
            pull_request)
              # HEAD is the PR merge commit: first parent is the base branch tip.
              git diff --name-only HEAD^1 HEAD > changed.txt || rm -f changed.txt
              ;;
            push)
              git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null \
                && git diff --name-only "$BEFORE" HEAD > changed.txt || rm -f changed.txt
              ;;
          esac
          # Anything else (schedule, manual run, or a diff that failed) runs everything.
          if [ -f changed.txt ]; then
            if grep -qE '^apps/website/' changed.txt; then website=true; else website=false; fi
            echo "changed files:"; cat changed.txt
          fi
          echo "website=$website" >> "$GITHUB_OUTPUT"
          if [ "$website" = "true" ]; then
            echo "verify_args=" >> "$GITHUB_OUTPUT"
          else
            echo "verify_args=--filter=!website" >> "$GITHUB_OUTPUT"
            echo "apps/website/ unchanged: skipping the website build and its checks"
          fi

      - name: Setup Nub
        uses: nubjs/setup-nub@v0

      - name: Setup pnpm
        # Fixtures are independent pnpm installs, not nub workspaces.
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: nub ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium-${{ runner.os }}

      - name: Install Playwright chromium
        # Shared by the docs accessibility check and the capture tests. System
        # libraries are installed (apt, ~15s) only when chromium cannot launch.
        working-directory: packages/runner-playwright
        run: |
          nubx playwright-core install chromium
          if ! node --input-type=module -e "const { chromium } = await import('playwright-core'); await (await chromium.launch()).close()"; then
            echo "chromium failed to launch; installing system dependencies"
            nubx playwright-core install-deps chromium
          fi

      - name: Verify (build + lint + test)
        run: nubx turbo verify --force ${{ steps.changes.outputs.verify_args }}

      - name: App smoke test (boot once, curl health/API/HTML/htmx)
        if: ${{ !cancelled() }}
        run: bash scripts/smoke.sh

      - name: Built-artifact smoke (CLI via .bin symlink, scaffolded server boots)
        # The CLI and every package are built by the verify step. Scaffolds a
        # server, type-checks it, boots it and checks it serves and shuts down.
        if: ${{ !cancelled() }}
        working-directory: packages/cli
        env:
          RUN_SMOKE: "1"
          # Fails if the pipeline's default Node ever drifts off the minimum.
          SMOKE_NODE_MAJOR: "24"
        run: nubx vitest run src/smoke.integration.test.ts

      - name: Check website links
        # dist/ is already built by website#verify (dependsOn build) above.
        if: ${{ !cancelled() && steps.changes.outputs.website == 'true' }}
        working-directory: apps/website
        run: nub run check:links

      - name: Check website accessibility (axe, light/dark/mobile)
        if: ${{ !cancelled() && steps.changes.outputs.website == 'true' }}
        working-directory: apps/website
        run: nub run check:a11y

  capture:
    name: capture (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [storybook-8, storybook-9, storybook-10]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nub
        uses: nubjs/setup-nub@v0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: nub ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium-firefox-${{ runner.os }}

      - name: Install Playwright browsers (chromium, firefox)
        working-directory: packages/runner-playwright
        run: |
          nubx playwright-core install chromium firefox
          if ! node --input-type=module -e "const { chromium, firefox } = await import('playwright-core'); await (await chromium.launch()).close(); await (await firefox.launch()).close()"; then
            echo "a browser failed to launch; installing system dependencies"
            nubx playwright-core install-deps chromium firefox
          fi

      - name: Build workspace packages
        run: nubx turbo build --filter=@storyshelf/runner-playwright... --filter=@storyshelf/runner-puppeteer...

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ matrix.fixture }}-${{ hashFiles(format('fixtures/{0}/pnpm-lock.yaml', matrix.fixture)) }}

      - name: Install fixture
        run: pnpm --dir fixtures/${{ matrix.fixture }} install --frozen-lockfile

      - name: Build fixture Storybook
        run: pnpm --dir fixtures/${{ matrix.fixture }} run build-storybook

      - name: Real-browser capture tests
        working-directory: packages/runner-playwright
        env:
          # Absolute: cwd-independent. Must flow via `nub run` (step env does
          # not survive `nubx turbo`).
          FIXTURE_DIR: ${{ github.workspace }}/fixtures/${{ matrix.fixture }}
          RUN_INTEGRATION: "1"
        run: nub run test:integration

      - name: Puppeteer axe check (a11y)
        if: ${{ !cancelled() }}
        working-directory: packages/runner-puppeteer
        env:
          FIXTURE_DIR: ${{ github.workspace }}/fixtures/${{ matrix.fixture }}
          # puppeteer-core ships no browser; GitHub's ubuntu runners include Chrome.
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: nub run test:integration

  fly:
    name: fly (image + demo seed dry run)
    runs-on: ubuntu-latest
    env:
      STORYSHELF_URL: http://127.0.0.1:3000
      STORYSHELF_ADMIN_TOKEN: ci-admin-token
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nub
        uses: nubjs/setup-nub@v0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: nub ci

      - name: Build the workspace CLI
        run: nubx turbo build --filter=storyshelf

      - name: Build fixture Storybook
        working-directory: fixtures/storybook-8
        run: pnpm install --frozen-lockfile && pnpm run build-storybook

      # Same Dockerfile and build context as fly.yml's `flyctl deploy`, minus the push.
      - name: Build the Fly image
        run: docker build -f apps/fly-app/Dockerfile -t storyshelf-fly .

      - name: Boot the image
        run: |
          docker run -d --name storyshelf -p 3000:3000 \
            -e STORYSHELF_ADMIN_TOKEN="$STORYSHELF_ADMIN_TOKEN" storyshelf-fly
          for i in $(seq 1 30); do
            curl -fsS "$STORYSHELF_URL/api/v1/health" && exit 0
            sleep 2
          done
          echo "::error::the Fly image did not become healthy"
          exit 1

      - name: Seed the demo
        run: apps/fly-app/seed.sh

      - name: Demo captures through the pipeline
        run: |
          for i in $(seq 1 90); do
            status="$(curl -fsS -H "Authorization: Bearer $STORYSHELF_ADMIN_TOKEN" \
              "$STORYSHELF_URL/api/v1/projects/demo-design-system/builds" | jq -r '[.[].status] | join(" ")')"
            echo "build statuses: $status"
            case "$status" in
              *failed*) echo "::error::a demo build failed"; exit 1 ;;
              *pending*|*capturing*|*comparing*|"") sleep 5 ;;
              *) exit 0 ;;
            esac
          done
          echo "::error::demo builds did not settle in time"
          exit 1

      - name: Re-seed is a no-op
        run: apps/fly-app/seed.sh | tee reseed.log && grep -q "up to date" reseed.log

      - name: Container logs
        if: ${{ failure() }}
        run: docker logs storyshelf
