name: CI

# One job: verify, smoke, docs checks and the real-browser capture tests share a
# single install/build/Chromium. Only the Storybook 8 fixture runs for now
# (fixtures/storybook-9 and -10 are skipped; re-add them as steps below).
on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    # Nightly drift check (Storybook/pnpm/Playwright move fast).
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nub
        uses: nubjs/setup-nub@v0

      - name: Setup pnpm
        # Fixtures are independent pnpm installs, not nub workspaces.
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: nub ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-chromium-${{ runner.os }}

      - name: Install Playwright chromium
        # Shared by the docs accessibility check and the capture tests. System
        # libraries are installed (apt, ~15s) only when chromium cannot launch.
        working-directory: packages/runner-playwright
        run: |
          nubx playwright-core install chromium
          if ! node --input-type=module -e "const { chromium } = await import('playwright-core'); await (await chromium.launch()).close()"; then
            echo "chromium failed to launch; installing system dependencies"
            nubx playwright-core install-deps chromium
          fi

      - name: Verify (build + lint + test)
        run: nubx turbo verify --force

      - name: App smoke test (boot once, curl health/API/HTML/htmx)
        if: ${{ !cancelled() }}
        run: bash scripts/smoke.sh

      - name: Check website links
        # dist/ is already built by website#verify (dependsOn build) above.
        if: ${{ !cancelled() }}
        working-directory: apps/website
        run: nub run check:links

      - name: Check website accessibility (axe, light/dark/mobile)
        if: ${{ !cancelled() }}
        working-directory: apps/website
        run: nub run check:a11y

      - name: Get pnpm store path
        id: pnpm-store
        if: ${{ !cancelled() }}
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-storybook-8-${{ hashFiles('fixtures/storybook-8/pnpm-lock.yaml') }}

      - name: Install fixture (storybook-8)
        if: ${{ !cancelled() }}
        run: pnpm --dir fixtures/storybook-8 install --frozen-lockfile

      - name: Build fixture Storybook (storybook-8)
        if: ${{ !cancelled() }}
        run: pnpm --dir fixtures/storybook-8 run build-storybook

      - name: Real-browser capture tests (storybook-8)
        # Workspace packages are already built by the verify step.
        if: ${{ !cancelled() }}
        working-directory: packages/runner-playwright
        env:
          # Absolute: cwd-independent. Must flow via `nub run` (step env does
          # not survive `nubx turbo`).
          FIXTURE_DIR: ${{ github.workspace }}/fixtures/storybook-8
          RUN_INTEGRATION: "1"
        run: nub run test:integration
