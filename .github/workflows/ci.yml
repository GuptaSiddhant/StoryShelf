name: CI

# `verify` runs build/lint/test and smoke checks; `storybook-dev` opens every story of the app's
# Storybook in the dev server (the production build tree-shakes what the dev server still runs);
# `postgres-lifecycle` runs the build-reference contract against a real Postgres server (PGlite cannot
# prove row locking); `website` builds the docs site and runs its link and accessibility checks; `capture` (capture.yml) runs the
# real-browser capture tests on storybook-9; `fly` (fly-dry-run.yml) is the deploy dry run.
# Every Storybook fixture and the Fly dry run also run nightly (nightly.yml).
#
# Node: the whole job runs on the version `setup-nub` resolves from
# package.json#devEngines.runtime (24.x, the minimum supported Node) — there is
# no separate Node setup step.
#
# Website: the `website` job runs only when apps/website/ changed (manual runs always run it).
# The `changes` job also skips `capture` and `fly` for PRs that only touch docs, the
# website or the fixtures this run does not use.
#
# Labels do not start this workflow: adding or removing one used to re-run (and cancel) the whole
# suite. The `changeset` check, which reads the `no-release` label, lives in changeset.yml. The
# `ci:full` label is read on the next push (a re-run keeps the original event, labels included).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    # Epic branches collect the task PRs of one epic (AGENTS.md); each push to one runs the
    # full verify like main, without main's deploy and preview workflows.
    branches: ["main", "epic/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only PRs cancel superseded runs: every commit on main gets the full verify and saves the turbo cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheap first job: decides what the rest of the run needs. Anything it cannot work out
  # (manual run, failed diff) runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.detect.outputs.website }}
      heavy: ${{ steps.detect.outputs.heavy }}
      full: ${{ steps.detect.outputs.full }}
      app: ${{ steps.detect.outputs.app }}
      postgres: ${{ steps.detect.outputs.postgres }}
      force: ${{ steps.detect.outputs.force }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 2 is enough to diff a PR's merge commit against its base, or a push
          # against its parent.
          fetch-depth: 2

      - name: Detect changed areas
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          HEAD_REF: ${{ github.head_ref }}
          # Paths that cannot change the Fly image or the capture tests: the docs site, docs,
          # markdown, and the fixtures the PR run does not use.
          IGNORABLE: '^(apps/website/|docs/|fixtures/storybook-(8|10)/|\.github/ISSUE_TEMPLATE/)|\.md$'
          # A change here can alter every package's build/test inputs, or the test selection
          # itself, so the PR gate runs the full suite rather than trusting `--affected`.
          FULL: '^(package\.json|nub\.lock|turbo\.json|nub\.jsonc|tsconfig\.json|config/|\.github/workflows/|\.github/actions/|scripts/|packages/[^/]+/(package\.json|turbo\.json|tsconfig\.json|tsdown\.config\.|vitest\.config\.))'
        run: |
          website=true
          heavy=true
          full=true
          app=true
          postgres=true
          # `--force` (no turbo cache) for a manual run, a diff that failed, or a change to the
          # files that decide every task's hash. Otherwise a full run replays cached tasks; the
          # nightly run (nightly.yml) is the forced full build that catches a wrong cache input.
          force=true
          case "$EVENT" in
            pull_request)
              # HEAD is the PR merge commit: first parent is the base branch tip.
              git diff --name-only HEAD^1 HEAD > changed.txt || rm -f changed.txt
              ;;
            push)
              # A push to main or an epic branch always validates the whole workspace.
              git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null \
                && git diff --name-only "$BEFORE" HEAD > changed.txt || rm -f changed.txt
              ;;
          esac
          # Anything else (manual run, or a diff that failed) runs everything.
          if [ -f changed.txt ]; then
            echo "changed files:"; cat changed.txt
            if grep -qE '^apps/website/' changed.txt; then website=true; else website=false; fi
            if grep -vqE "$IGNORABLE" changed.txt; then heavy=true; else heavy=false; fi
            # The app's Storybook imports core, so a change to either (or the lockfile, or this
            # workflow) can break it in the dev server.
            if grep -qE '^(packages/(app|core)/|nub\.lock|\.github/workflows/ci\.yml)' changed.txt; then app=true; else app=false; fi
            # The Postgres retention lifecycle: its package, the shared contract it must pass, and
            # the interface that contract exercises (a locking regression must not merge).
            if grep -qE '^(packages/db-postgres/|packages/core/src/test-helpers/|packages/core/src/adapters/database\.ts|\.github/workflows/ci\.yml)' changed.txt; then postgres=true; else postgres=false; fi
            if grep -qE "$FULL" changed.txt; then force=true; else force=false; fi
            if [ "$EVENT" = "pull_request" ]; then
              # An epic branch merging into main carries many tasks: always verify everything.
              if grep -qE "$FULL" changed.txt \
                || printf '%s' "$LABELS" | grep -qE '(^|,)ci:full(,|$)' \
                || case "$HEAD_REF" in epic/*) true ;; *) false ;; esac; then
                full=true
              else
                full=false
              fi
            fi
          fi
          echo "website=$website" >> "$GITHUB_OUTPUT"
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "postgres=$postgres" >> "$GITHUB_OUTPUT"
          echo "force=$force" >> "$GITHUB_OUTPUT"
          echo "website=$website heavy=$heavy full=$full app=$app postgres=$postgres force=$force"

  verify:
    name: verify
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write # save-turbo-cache deletes main's older turbo caches
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `--affected` needs the merge base, so the full history is required here.
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Setup Terraform
        # The cli's terraform-*.integration.test.ts skip without a terraform binary, so install one
        # here: `fmt -check` and `validate` of the generated AWS/GCP/Azure output run on every PR.
        # 1.9.x matches TERRAFORM_REQUIRED_VERSION (">= 1.9") in packages/cli.
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"
          terraform_wrapper: false

      - name: Check ADR references and size
        run: nub run docs:check

      - name: Lint and format-check every tracked file (what the commit hook checks)
        # `verify` lints each package's own globs; this also covers `scripts/` and any file outside them.
        run: |
          node --test scripts/check-files.test.mjs
          nub run lint:files

      - name: Verify (build + Storybook + lint + test)
        # `verify` builds the app's Storybook once (build-storybook), so a broken story fails the PR.
        # The website has its own job (below), so it runs in parallel and only when it changed.
        # PRs run only affected packages (plus their dependents); global/risky changes, pushes
        # to main and manual runs use the full workspace, with the turbo cache unless `force`
        # (see the `changes` job). One test task at a time keeps
        # per-package vitest worker pools from oversubscribing a small runner.
        env:
          TURBO_CONCURRENCY: "1"
          # Switches on the Terraform scaffold suites in packages/cli (setup-terraform installs the binary).
          RUN_TERRAFORM: "1"
          TURBO_SCM_BASE: origin/main
          TURBO_SCM_HEAD: HEAD
        run: |
          if [ "${{ needs.changes.outputs.full }}" = "true" ] && [ "${{ needs.changes.outputs.force }}" = "true" ]; then
            nubx turbo verify --filter='!website' --force
          elif [ "${{ needs.changes.outputs.full }}" = "true" ]; then
            nubx turbo verify --filter='!website'
          else
            nubx turbo verify --filter='!website' --affected
          fi

      - name: App smoke test (boot once, curl health/API/HTML/htmx)
        if: ${{ !cancelled() }}
        run: bash scripts/smoke.sh

      - name: Build packages for built-artifact smoke
        # Docs-only PRs select no packages with `--affected`, so the verify step
        # builds nothing; the smoke test needs every non-website `dist/`.
        if: ${{ !cancelled() }}
        run: nubx turbo run build --filter='!website'

      - name: Built-artifact smoke (CLI via .bin symlink, scaffolded server boots)
        # Scaffolds a server, type-checks it, boots it and checks it serves and shuts down.
        if: ${{ !cancelled() }}
        working-directory: packages/cli
        env:
          RUN_SMOKE: "1"
          # Fails if the pipeline's default Node ever drifts off the minimum.
          SMOKE_NODE_MAJOR: "24"
        run: nubx vitest run src/smoke.integration.test.ts

      # Last, and only here: this job builds every workspace package, so its cache serves
      # the capture, Fly and seed jobs too.
      - name: Save turbo cache
        uses: ./.github/actions/save-turbo-cache

  storybook-dev:
    name: storybook-dev
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Build the packages the app's Storybook imports
        run: nubx turbo run build --filter='@storyshelf/app^...'

      - name: Open every story in the Storybook dev server (a console error fails)
        working-directory: packages/app
        env:
          # The runner's preinstalled Chrome, as in the website a11y check: no Playwright download.
          STORYBOOK_SMOKE_BROWSER_CHANNEL: chrome
        run: nub run smoke:storybook

  # The build-reference contract (ADR 0039) on a real Postgres server, one connection per lifecycle.
  # PGlite runs the same suite in `verify` but is a single connection, so only this job proves the
  # row locks. The service is the one the nightly compatibility workflow uses.
  postgres-lifecycle:
    name: postgres-lifecycle
    needs: changes
    if: ${{ needs.changes.outputs.postgres == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: storyshelf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d storyshelf_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Build the packages the adapter imports
        run: nubx turbo run build --filter='@storyshelf/db-postgres^...'

      - name: Run the build-reference contract against real Postgres
        working-directory: packages/db-postgres
        env:
          LIVE_CLOUD: "1"
          # The suite clears and claims shared content rows: this service container is disposable.
          POSTGRES_SCHEMA_MUTATION_TEST: "1"
          DATABASE_URL: postgres://postgres:test-password@127.0.0.1:5432/storyshelf_test
        # One file at a time: each runs the migrations, and two first migrations on a fresh database
        # collide ("duplicate key value violates unique constraint pg_type_typname_nsp_index").
        run: nubx vitest run --no-file-parallelism src/build-reference-lifecycle.test.ts src/retention-activation.test.ts

  website:
    name: website
    needs: changes
    if: ${{ needs.changes.outputs.website == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify (build + lint + link check)
        # `website#verify` builds the docs site and runs its link check (dist/ stays for a11y).
        run: nubx turbo verify --filter=website

      - name: Check website accessibility (axe, light/dark/mobile)
        working-directory: apps/website
        env:
          # The runner's preinstalled Chrome: the docs must be accessible in any browser, so
          # no pinned Playwright Chromium is needed (the capture job keeps its pinned builds).
          A11Y_BROWSER_CHANNEL: chrome
        run: nub run check:a11y

  capture:
    name: capture
    needs: changes
    if: ${{ needs.changes.outputs.heavy == 'true' }}
    uses: ./.github/workflows/capture.yml
    with:
      # The fixture the Fly demo runs on; nightly.yml covers every supported version.
      fixtures: '["storybook-9"]'

  fly:
    name: fly
    needs: changes
    if: ${{ needs.changes.outputs.heavy == 'true' }}
    uses: ./.github/workflows/fly-dry-run.yml

  # The one check to require in branch protection (with `changeset` from changeset.yml): `capture`
  # and `fly` are skipped for docs-only PRs, and a skipped reusable-workflow job creates no child
  # checks, so requiring those by name would wait forever. This passes when every job passed or
  # was skipped.
  ci:
    name: ci
    if: ${{ always() }}
    needs: [changes, verify, storybook-dev, postgres-lifecycle, website, capture, fly]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a CI job finished as '$result'"; exit 1 ;;
            esac
          done
