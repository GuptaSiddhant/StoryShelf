name: Fly Deploy

# Every push to main: deploys the workspace version of the demo
# (apps/fly-app, local adapters). Manual via workflow_dispatch.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::FLY_API_TOKEN secret is not set. Create one with 'fly tokens create deploy' and add it as a repository secret."
            exit 1
          fi

      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy . --config apps/fly-app/fly.toml --dockerfile apps/fly-app/Dockerfile --remote-only

      - name: Check status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl status -a storyshelf

      # The vendored HTMX bundle must be present in the image or every hx-*
      # interaction (and CSRF header injection) silently breaks at runtime.
      - name: Smoke test vendored HTMX asset
        run: |
          for i in $(seq 1 10); do
            if curl -fsS https://storyshelf.fly.dev/assets/htmx.js -o /tmp/htmx.js \
              && grep -q "htmx" /tmp/htmx.js; then
              echo "Served /assets/htmx.js ($(wc -c </tmp/htmx.js) bytes)"
              exit 0
            fi
            echo "Attempt $i: asset not ready, retrying"
            sleep 6
          done
          echo "::error::/assets/htmx.js was not served correctly"
          exit 1
