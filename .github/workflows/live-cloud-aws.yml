# Schedule deferred; see #410.
name: Live Cloud AWS

# Phase 1 live tests: S3 against strictly real AWS (no fakes, no emulators).
# The bucket is pre-provisioned (manually or via `terraform apply` of
# `deploy/terraform/aws`); the `live-s3` job only consumes `terraform output -json` values as
# secrets and never creates infrastructure. The `module-apply` job applies the module itself.
#
# Both jobs run in the `live-cloud` environment, so a dispatch waits for a reviewer before any
# secret is exposed (#1305). Credentials: OIDC when the variable AWS_ROLE_ARN is set (an IAM role
# that trusts this repository's `live-cloud` environment), else the static keys. The owner's setup
# steps are in docs/testing.md, "Live-cloud credentials".
#
# Required secrets:
# - AWS_REGION (e.g. us-east-1)
# - LIVE_S3_BUCKET (terraform output: s3_bucket)
# - AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, only until AWS_ROLE_ARN is set
#
# Third-party actions are pinned by commit SHA (the tag is in the comment).
on:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a run in progress: a cancelled module-apply would lose its runner-local state and
# orphan a billed stack that destroy can no longer find. A second dispatch waits instead.
concurrency:
  group: live-cloud-aws
  cancel-in-progress: false

jobs:
  # Real S3 suites. Hermetic tests in this subpath also run
  # (they must stay green); live files skip without LIVE_CLOUD=1.
  live-s3:
    runs-on: ubuntu-latest
    environment: live-cloud
    permissions:
      contents: read
      id-token: write # OIDC to the cloud; unused while the static keys are the fallback
    env:
      LIVE_CLOUD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Nub
        uses: nubjs/setup-nub@8c7bade1432a9acf9a7ad169aa7288713d046161 # v0.6.2
        with:
          # Pinned (#782, now 0.10.0): exact, so no job drifts to a new nub. protobufjs's build script is denied in package.json `allowScripts`.
          nub-version: "0.10.0"

      # Before any credential exists, so no install script can read one.
      - name: Install dependencies
        run: nub ci

      - name: Fail fast on missing secrets
        env:
          HAS_AWS_REGION: ${{ secrets.AWS_REGION != '' }}
          HAS_S3_BUCKET: ${{ secrets.LIVE_S3_BUCKET != '' }}
          HAS_CREDENTIALS: ${{ vars.AWS_ROLE_ARN != '' || (secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '') }}
        run: |
          set -e
          for v in HAS_AWS_REGION HAS_S3_BUCKET HAS_CREDENTIALS; do
            if [ "${!v}" != "true" ]; then
              echo "::error::Missing ${v#HAS_}: set the secret (or AWS_ROLE_ARN for credentials). See the workflow header."
              exit 1
            fi
          done

      # OIDC only. The action writes nothing to the job's environment (output-env-credentials:
      # false); the role's credentials are step outputs, passed to the one step that needs them.
      # Without AWS_ROLE_ARN this step is skipped and that step takes the static keys itself.
      - name: Assume the AWS role (OIDC)
        id: aws
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: storyshelf-live-s3-${{ github.run_id }}
          output-credentials: true
          output-env-credentials: false

      - name: Run S3 suites (hermetic + live)
        env:
          S3_BUCKET: ${{ secrets.LIVE_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ROLE_ARN != '' && steps.aws.outputs.aws-access-key-id || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_ROLE_ARN != '' && steps.aws.outputs.aws-secret-access-key || secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
        # --force: live results must never come from the turbo cache.
        run: nubx turbo test --filter='@storyshelf/storage' --force -- src/s3

  # The customer path (#891, ADR 0050): apply the AWS module's `examples/minimal` with the current
  # release image, smoke-test the running stack, destroy it. Real AWS, billed: it runs only when the
  # repository variable LIVE_AWS_MODULE_APPLY is "1". First boot is unattended: each task's `db-init`
  # container creates the app database user and grants it `rds_iam` before the app starts (module
  # README, "Database: IAM authentication"), so the smoke test needs no manual step. Uses the same AWS
  # credentials as live-s3. Destroy runs even when the apply or the smoke test fails.
  module-apply:
    runs-on: ubuntu-latest
    if: ${{ vars.LIVE_AWS_MODULE_APPLY == '1' }}
    environment: live-cloud
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # OIDC to the cloud; unused while the static keys are the fallback
    env:
      # Unique per run (the module caps a name at 20 characters), so runs never collide.
      TF_VAR_name: shelf-ci-${{ github.run_id }}
    defaults:
      run:
        working-directory: deploy/terraform/aws/examples/minimal
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.x"
          terraform_wrapper: false

      - name: Resolve the current release image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          echo "TF_VAR_image_version=${tag#v}" >> "$GITHUB_ENV"
          echo "applying the module with image ${tag#v}"

      # OIDC only, as in live-s3: nothing goes into the job's environment, so the smoke test never
      # holds a credential; Apply and Destroy get them in their own env. Two hours, so the
      # credentials outlive the job's 60-minute timeout and the destroy after it; the role's
      # maximum session duration must allow it (docs/testing.md).
      - name: Assume the AWS role (OIDC)
        id: aws
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: storyshelf-module-apply-${{ github.run_id }}
          role-duration-seconds: 7200
          output-credentials: true
          output-env-credentials: false

      - name: Apply
        env:
          TF_VAR_region: ${{ secrets.AWS_REGION }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ROLE_ARN != '' && steps.aws.outputs.aws-access-key-id || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_ROLE_ARN != '' && steps.aws.outputs.aws-secret-access-key || secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
        run: |
          set -e
          terraform init -input=false
          terraform apply -input=false -auto-approve

      - name: Smoke test the stack
        run: |
          set -e
          url=$(terraform output -raw url)
          for _ in $(seq 1 60); do
            if curl -fsS "$url/api/v1/health" >/dev/null; then break; fi
            sleep 15
          done
          SMOKE_BASE_URL="$url" bash "$GITHUB_WORKSPACE/scripts/smoke.sh"

      - name: Destroy
        if: ${{ always() }}
        env:
          TF_VAR_region: ${{ secrets.AWS_REGION }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ROLE_ARN != '' && steps.aws.outputs.aws-access-key-id || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ vars.AWS_ROLE_ARN != '' && steps.aws.outputs.aws-secret-access-key || secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
        run: terraform destroy -input=false -auto-approve
