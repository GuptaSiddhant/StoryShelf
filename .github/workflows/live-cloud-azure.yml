# Schedule deferred; see #410.
name: Live Cloud Azure

# Phase 2 live tests: Blob against strictly real Azure (no fakes, no
# Azurite). The container is pre-provisioned (manually or via
# `terraform apply` of `deploy/terraform/azure`); this
# live job only consumes `terraform output -json` values as secrets and
# never creates infrastructure; `module-apply` applies the module itself.
#
# Required repository secrets:
# - AZURE_STORAGE_CONNECTION (terraform output: storage_connection_string)
# - LIVE_AZURE_CONTAINER (existing blob container name)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-cloud-azure
  cancel-in-progress: true

jobs:
  # Real Blob suites. Hermetic tests in the same packages also run (they must
  # stay green); live files skip without LIVE_CLOUD=1.
  live-azure:
    runs-on: ubuntu-latest
    env:
      LIVE_CLOUD: "1"
      AZURE_STORAGE_CONNECTION: ${{ secrets.AZURE_STORAGE_CONNECTION }}
      LIVE_AZURE_CONTAINER: ${{ secrets.LIVE_AZURE_CONTAINER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Nub
        uses: nubjs/setup-nub@v0
        with:
          # Pinned (#782, now 0.10.0): exact, so no job drifts to a new nub. protobufjs's build script is denied in package.json `allowScripts`.
          nub-version: "0.10.0"

      - name: Install dependencies
        run: nub ci

      - name: Fail fast on missing secrets
        run: |
          set -e
          for v in AZURE_STORAGE_CONNECTION LIVE_AZURE_CONTAINER; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required secret (or env): $v. See workflow header."
              exit 1
            fi
          done

      - name: Run Blob suites (hermetic + live)
        # --force: live results must never come from the turbo cache.
        run: nubx turbo test --filter='@storyshelf/storage-azure' --force

  # The customer path (#893, ADR 0050): apply the Azure module's `examples/minimal` with the current
  # release image, smoke-test the running stack, destroy it. Real Azure, billed: it runs only when the
  # repository variable LIVE_AZURE_MODULE_APPLY is "1", which the owner turns on (billed). The image
  # reads the module's Blob settings (see the module README, "Image contract"). Needs a service principal that
  # may create resources and role assignments in the subscription: secrets ARM_CLIENT_ID,
  # ARM_CLIENT_SECRET, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID. Destroy runs even when the apply or the
  # smoke test fails. The Azure Playwright Workspace capture (experimental preset) is not part of
  # this job yet: it needs a workspace and its token in a Key Vault (module README, "Capture").
  module-apply:
    runs-on: ubuntu-latest
    if: ${{ vars.LIVE_AZURE_MODULE_APPLY == '1' }}
    timeout-minutes: 60
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      GH_TOKEN: ${{ github.token }}
      # Unique per run (the module caps a name at 20 characters), so runs never collide.
      TF_VAR_name: shelf-ci-${{ github.run_id }}
    defaults:
      run:
        working-directory: deploy/terraform/azure/examples/minimal
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"
          terraform_wrapper: false

      - name: Fail fast on missing secrets
        run: |
          set -e
          for v in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_TENANT_ID ARM_SUBSCRIPTION_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required secret (or env): $v. See the job comment."
              exit 1
            fi
          done

      - name: Resolve the current release image
        run: |
          set -e
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          echo "TF_VAR_image_version=${tag#v}" >> "$GITHUB_ENV"
          echo "applying the module with image ${tag#v}"

      - name: Apply
        run: |
          set -e
          terraform init -input=false
          terraform apply -input=false -auto-approve

      - name: Smoke test the stack
        run: |
          set -e
          url=$(terraform output -raw url)
          for _ in $(seq 1 60); do
            if curl -fsS "$url/api/v1/health" >/dev/null; then break; fi
            sleep 15
          done
          SMOKE_BASE_URL="$url" bash "$GITHUB_WORKSPACE/scripts/smoke.sh"

      - name: Destroy
        if: ${{ always() }}
        run: terraform destroy -input=false -auto-approve
