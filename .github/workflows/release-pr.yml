# Opens the stable release pull request when a release is due (ADR 0043, owner decisions
# 2026-11-09). `scripts/release-due.mjs` decides:
#
# - a P0 pull request (label `p0-critical`) merged into `main`;
# - an epic branch (`epic/…`) merged into `main`;
# - otherwise, the daily run: the last minor release (`vX.Y.0`) is 7 or more days old.
#
# Nothing happens without pending changesets. The bump (minor or patch) comes from the changesets; a
# `major` is refused before 1.0 (no v1 until the owner has dogfood proof). The job runs
# `nub run release:prepare` on `main`, pushes `release/v<version>` and opens the pull request. Only
# the owner merges it; merging is what publishes (`release.yml`).
#
# Refresh (#1098): while one `release/v*` pull request is open and `main` has gained changesets that
# branch does not consume, the job prepares the release again on `main` and
# - same version: updates that branch with `git push --force-with-lease=<ref>:<sha>`, where <sha> is
#   the open pull request's head, i.e. what this workflow last pushed. The pull request keeps its
#   number and the owner's auto-merge. A branch someone else moved since is refused, never
#   overwritten.
# - new version (patch to minor): pushes the new `release/v<version>`, opens its pull request and
#   closes the old one, deleting the old branch.
# Only this workflow pushes to `release/*` (the owner's ruleset restricts it to the workflow's
# token), and nothing here ever force-pushes another branch. Without a refresh, a conflict after
# `main` moved had to be cleared by hand.
#
# pull_request_target runs this file from `main` and checks out `main`, never the pull request's
# code. The branch is pushed with AUTOUPDATE_TOKEN when it is set, so CI runs on the release pull
# request; with GITHUB_TOKEN the pull request opens but its checks need a push or a re-run.
name: release-pr

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  schedule:
    - cron: "37 6 * * *" # daily check for the 7-day minor rule
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.AUTOUPDATE_TOKEN || github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # tags date the last minor release
          token: ${{ secrets.AUTOUPDATE_TOKEN || github.token }}

      - name: Is a release due?
        id: due
        env:
          EVENT: ${{ github.event_name }}
          MERGED: ${{ github.event.pull_request.merged }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -e
          OPEN_RELEASE_PRS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '[.[] | select(.head.ref | startswith("release/v")) | {number, ref: .head.ref, sha: .head.sha}]')
          export OPEN_RELEASE_PRS
          node scripts/release-due.mjs "$EVENT"

      - name: Setup workspace
        if: steps.due.outputs.action != 'none'
        uses: ./.github/actions/setup-workspace

      - name: Prepare the release branch
        if: steps.due.outputs.action != 'none'
        id: prepare
        env:
          ACTION: ${{ steps.due.outputs.action }}
          OPEN_REF: ${{ steps.due.outputs.open_ref }}
          OPEN_SHA: ${{ steps.due.outputs.open_sha }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          nub run release:prepare
          version=$(node -p "require('./packages/core/package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          outcome=open
          if [ "$ACTION" = refresh ]; then
            outcome=$(node scripts/release-due.mjs --outcome "$OPEN_REF" "release/v${version}")
          fi
          echo "outcome=${outcome}" >> "$GITHUB_OUTPUT"
          if [ "$outcome" = update ]; then
            # Only the sha this workflow last pushed (the open PR's head) may be replaced.
            git push --force-with-lease="release/v${version}:${OPEN_SHA}" origin "release/v${version}"
          else
            git push -u origin "release/v${version}"
          fi

      - name: Open the release pull request
        if: steps.due.outputs.action != 'none' && steps.prepare.outputs.outcome != 'update'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          REASON: ${{ steps.due.outputs.reason }}
        run: |
          set -e
          printf 'Release v%s, opened because %s.\n\nThe bump comes from the pending changesets. Merging this pull request publishes `latest` to npm, tags `v%s` and creates the GitHub Release (`release.yml`). Only the owner merges it (ADR 0043).\n' \
            "$VERSION" "$REASON" "$VERSION" > body.md
          gh pr create --base main --head "release/v${VERSION}" \
            --title "chore(release): v${VERSION}" --body-file body.md

      - name: Close the replaced release pull request
        if: steps.prepare.outputs.outcome == 'replace'
        env:
          OLD_NUMBER: ${{ steps.due.outputs.open_number }}
          OLD_REF: ${{ steps.due.outputs.open_ref }}
          OLD_SHA: ${{ steps.due.outputs.open_sha }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -e
          gh pr close "$OLD_NUMBER" --comment "Superseded: the changesets now call for v${VERSION}, so a new release pull request replaces this one."
          # Only this workflow pushes release/*; delete only the sha this run planned against.
          case "$OLD_REF" in
            release/v*) git push --force-with-lease="${OLD_REF}:${OLD_SHA}" origin --delete "$OLD_REF" ;;
          esac
