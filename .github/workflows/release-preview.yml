name: Package previews

# Preview each push to an epic branch without publishing to npm (ADR 0043). `main` is covered by the
# `next` channel in release.yml, which publishes real `next` builds when changesets are pending.
on:
  push:
    branches: ["epic/**"]

# pkg.pr.new resolves a branch to the latest commit published for it, so a newer push supersedes an
# older preview of the same branch instead of racing it.
concurrency:
  group: package-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish package previews
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Build packages
        run: nub run build --filter='./packages/*'

      # npm pack cannot resolve catalog:; pkg.pr.new will replace sibling workspace
      # dependencies with preview URLs when it packs all packages together.
      - name: Rewrite workspace and catalog references
        run: node scripts/rewrite-workspace-protocol.mjs

      - name: Publish previews
        run: ./node_modules/.bin/pkg-pr-new publish --comment=off --no-template --previewVersion --bin=storyshelf './packages/*'
