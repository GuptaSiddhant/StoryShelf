name: Release

# All npm publishing lives in THIS file: the npm trusted publisher of every package is registered
# to this workflow file name (ADR 0043). Three ways in:
#
# - push to `main`: when changesets are pending, publish a throwaway `x.y.z-next-<sha>` build of
#   every package to npm under the `next` dist-tag. No pending changeset publishes nothing. The
#   snapshot version is never committed.
# - `workflow_dispatch` (confirm: release): a stable release. One run versions from the pending
#   changesets, commits `chore(release): v<version>` to `main`, tags it, pushes both, then
#   publishes to `latest` (npm and JSR) and creates the GitHub Release. `dry_run` does everything
#   except pushing and publishing. A tag pushed with the default token does not start another
#   workflow, which is why the publish jobs run in the same run.
# - push of a `v*` tag: the emergency path (a release cut from a workstation with
#   `nub ./scripts/release.mjs`, then `git push --follow-tags`).
on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "release" to cut a stable release from the pending changesets'
        required: true
        type: string
      dry_run:
        description: "Version, build and npm publish --dry-run only: push and publish nothing"
        required: true
        type: boolean
        default: true

# Read-only by default; each job that writes or publishes states what it needs.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------------------------
  # `next` channel (push to main)
  # ---------------------------------------------------------------------------------------------

  # Cheap gate: are there changesets to release? Needs no install (the script has no dependencies).
  pending:
    name: pending changesets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      count: ${{ steps.count.outputs.pending }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Count pending changesets
        id: count
        run: node scripts/version-packages.mjs --pending

  next:
    name: publish next
    needs: [pending]
    if: needs.pending.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore provenance + npm trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Nub
        uses: nubjs/setup-nub@v0

      - name: Check npm version for OIDC
        run: node scripts/check-npm-oidc.mjs

      - name: Install dependencies
        run: nub ci

      - name: Version a snapshot (working tree only, never committed)
        # `x.y.z-next-<sha>`: the version the pending changesets calculate, plus a suffix.
        run: node scripts/version-packages.mjs --snapshot

      - name: Validate the snapshot
        id: guard
        run: node scripts/release-validate.mjs --tree

      - name: Build packages
        run: nub run build --filter='./packages/*'

      - name: Rewrite workspace protocol for npm manifest
        run: node scripts/rewrite-workspace-protocol.mjs

      - name: Publish to npm under the next tag (trusted / provenance)
        run: node scripts/publish-npm.mjs "${{ steps.guard.outputs.version }}" next

  # ---------------------------------------------------------------------------------------------
  # Stable channel (manual)
  # ---------------------------------------------------------------------------------------------

  # Version from the pending changesets, commit and tag on main, push both.
  prepare:
    name: prepare stable release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release commit and tag are pushed with this token
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
    steps:
      - name: Guard
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "release" ]; then
            echo "::error::confirm must be exactly: release"
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::a stable release is cut from main, not ${GITHUB_REF}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Nub
        uses: nubjs/setup-nub@v0

      - name: Install dependencies
        run: nub ci

      - name: Version, commit and tag
        id: cut
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          # One test task at a time, as in CI's verify job: a small runner times out otherwise.
          TURBO_CONCURRENCY: "1"
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # release.mjs verifies this exact tree first (turbo verify), then versions, commits, tags
          # and runs `nub publish -r --dry-run`. A run is never cut from an unverified commit, even
          # if CI on main is red or still pending.
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/release.mjs --dry-run
            exit 0
          fi
          node scripts/release.mjs
          VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Push the release commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.cut.outputs.tag }}
        run: |
          set -e
          # One atomic push: the commit and the tag both land or neither does, so a failure cannot
          # leave main with a release commit, consumed changesets and no tag. If main moved while
          # this ran, the push is refused and nothing is published.
          git push --atomic origin HEAD:main "refs/tags/${TAG}"

  # ---------------------------------------------------------------------------------------------
  # Publishing a tag (the manual release above, or an emergency tag push)
  # ---------------------------------------------------------------------------------------------

  # Version gate: single source of truth. Both publishers depend on this job
  # (not on each other), so a bad tag/tree fails fast before either registry
  # is touched — while npm and JSR still never block each other.
  validate:
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (github.event_name == 'workflow_dispatch' && needs.prepare.result == 'success' && needs.prepare.outputs.tag != '')
      ) }}
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.guard.outputs.tag }}
      version: ${{ steps.guard.outputs.version }}
      dist_tag: ${{ steps.guard.outputs.dist_tag }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          PREPARED: ${{ needs.prepare.outputs.tag }}
        run: echo "name=${PREPARED:-${GITHUB_REF_NAME}}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.name }}
          fetch-depth: 0

      - name: Guard tag and fixed versions
        id: guard
        env:
          # A tag name is user-controlled text: through the environment, never inline in the script.
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          node scripts/release-validate.mjs "${TAG}"

  # npm publish. Depends on validate, independent of JSR: a failure here
  # never blocks publish-jsr, and is never blocked by it.
  publish-npm:
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore provenance + npm trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Setup Nub
        uses: nubjs/setup-nub@v0

      - name: Check npm version for OIDC
        # Before install: no project-state dependency, fails fast on a bad
        # toolchain. After Setup Nub so the tested npm is the publishing one.
        run: node scripts/check-npm-oidc.mjs

      - name: Install dependencies
        run: nub ci

      - name: Build packages
        # Not strictly required — prepublishOnly runs build — but fail-fast before provenance.
        run: nub run build --filter='./packages/*'

      - name: Rewrite workspace protocol for npm manifest
        # Plain npm publish ships dependencies verbatim, so workspace:*
        # must become caret ranges. Repo files keep workspace:*; only this
        # CI working tree is rewritten.
        run: node scripts/rewrite-workspace-protocol.mjs

      - name: Publish to npm (trusted / provenance)
        # OIDC trusted publishing: npm exchanges the workflow OIDC token
        # automatically — no NODE_AUTH_TOKEN. Requires a trusted publisher
        # configured per package on npmjs.com (one-time).
        run: node scripts/publish-npm.mjs "${{ needs.validate.outputs.version }}" "${{ needs.validate.outputs.dist_tag }}"

  # GitHub Release. Runs only after a successful npm publish (same semantics
  # as when these steps lived at the tail of publish-npm); JSR outcome can't
  # affect it. Needs no toolchain — just git history and the tag.
  github-release:
    runs-on: ubuntu-latest
    needs: [validate, publish-npm]
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Generate release notes
        id: log
        # CHANGELOG.md is the source of truth (minor releases roll up the previous
        # minor line); fall back to the git log when the tag has no section.
        run: |
          set -e
          TAG="${RELEASE_TAG}"
          if node scripts/release-notes.mjs "$TAG" > release-body.md; then
            echo "notes from CHANGELOG.md"
          else
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
            echo "no changelog section; git log fallback prev=$PREV_TAG current=$TAG"
            if [ -z "$PREV_TAG" ]; then
              LOG=$(git log --pretty='- %s (%h)' --no-merges)
            else
              LOG=$(git log "$PREV_TAG..HEAD" --pretty='- %s (%h)' --no-merges)
            fi
            {
              echo "## $TAG"
              echo ""
              echo "$LOG"
            } > release-body.md
          fi
          cat release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          body_path: release-body.md
          generate_release_notes: false

  # JSR publish. Depends on validate, independent of npm: `continue-on-error`
  # means a failure here never fails the workflow or blocks publish-npm.
  publish-jsr:
    needs: [validate]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # OIDC — JSR authenticates publish + attaches provenance, no token
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Setup Nub
        uses: nubjs/setup-nub@v0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.6.7

      - name: Install dependencies
        run: nub ci

      - name: Build packages (regenerates deno.json with current version)
        run: nub run build --filter='./packages/*'

      - name: "Rewrite workspace protocol for JSR manifest"
        # Same rewrite as the npm job; --allow-dirty tolerates it at publish.
        run: node scripts/rewrite-workspace-protocol.mjs

      - name: "Publish to JSR (dependency order: core first)"
        # deno publish directly (no npx jsr wrapper): the wrapper re-downloads
        # itself and its deno binary per package (~5 min each). Pinned deno
        # via Setup Deno above makes every package publish in seconds.
        run: node scripts/publish-jsr.mjs
