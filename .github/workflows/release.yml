name: Release

# All npm publishing lives in THIS file: the npm trusted publisher of every package is registered
# to this workflow file name (ADR 0043). The publish steps live in `.github/actions/npm-publish`, a
# composite action that runs inside these jobs, so the OIDC token still names this file. A run picks
# one channel (`detect`):
#
# - stable: a push to `main` whose shared version has no `v<version>` tag yet,
#   which is what merging a release pull request (`nub run release:prepare`) produces. Validate,
#   publish `latest` to npm, create tag `v<version>`, create the GitHub Release.
# - next: only by hand (`workflow_dispatch`, channel `next`) while changesets are pending: a
#   throwaway `x.y.z-next-<sha>` build of every package goes to npm under the `next` dist-tag; the
#   version is never committed. A push to `main` never publishes `next`, and there is no daily run
#   (ADR 0043, amendment 2026-11-11): `main` is previewed through pkg.pr.new (`release-preview.yml`).
# - none: nothing to publish.
#
# `workflow_dispatch` with channel `next` publishes a `next` build now. With channel `stable` (input:
# version) it re-runs the stable path for the version already on `main` after a failed publish.
# Pushing a tag starts nothing.
on:
  push:
    branches: [main]
    # Only the stable path runs on a push; a release PR changes package manifests and `.changeset/`.
    paths:
      - "packages/**"
      - ".changeset/**"
      - "package.json"
      - "nub.lock"
      - "scripts/release*.mjs"
      - "scripts/version-packages.mjs"
      - "scripts/changeset-lib.mjs"
      - ".github/actions/npm-publish/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      channel:
        description: "next: publish a next build now. stable: re-run a failed stable publish."
        required: true
        default: next
        type: choice
        options: [next, stable]
      version:
        description: "stable only: the version already on main whose publish failed (for example 0.9.0)"
        required: false
        type: string

# Read-only by default; each job that writes or publishes states what it needs.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Which channel is this run for? Cheap and dependency-free; also the guard for a manual re-run.
  detect:
    name: detect channel
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.detect.outputs.channel }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      sha: ${{ steps.detect.outputs.sha }} # the release commit: stable jobs publish and tag this, not main's tip
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags decide whether this version was released; history, which commit it was
          persist-credentials: false

      - name: Detect
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: node scripts/release-detect.mjs "$EVENT" "$REQUESTED" "$CHANNEL"

  # ---------------------------------------------------------------------------------------------
  # `next` channel
  # ---------------------------------------------------------------------------------------------

  next:
    name: publish next
    needs: [detect]
    if: needs.detect.outputs.channel == 'next'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore provenance + npm trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish a snapshot under the next tag
        uses: ./.github/actions/npm-publish
        with:
          snapshot: "true"
          dist-tag: next

  # ---------------------------------------------------------------------------------------------
  # Stable channel (a merged release pull request)
  # ---------------------------------------------------------------------------------------------

  # Version gate: single source of truth. A bad tree fails here, before anything is published.
  validate:
    name: validate release
    needs: [detect]
    if: needs.detect.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.guard.outputs.version }}
      dist_tag: ${{ steps.guard.outputs.dist_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Guard the fixed versions
        id: guard
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: node scripts/release-validate.mjs "$TAG"

  # npm publish. Skips versions already on npm, so a re-run resumes.
  publish-npm:
    needs: [detect, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore provenance + npm trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Publish the release
        uses: ./.github/actions/npm-publish
        with:
          version: ${{ needs.validate.outputs.version }}
          dist-tag: ${{ needs.validate.outputs.dist_tag }}

  # The container image (#887, ADR 0050): `ghcr.io/guptasiddhant/storyshelf:<version>` and `latest`
  # (with Chromium), plus `<version>-hosting` and `latest-hosting` (no browser). Stable releases only:
  # a `next` build never reaches here. amd64 and arm64, with SBOM and provenance attestations. It
  # authenticates with GITHUB_TOKEN (`packages: write`). The same build is also pushed to Docker Hub
  # (#1027) under the same tags, as one manifest per tag, so both registries share one digest. Docker
  # Hub is fail soft: with `DOCKERHUB_TOKEN` or `DOCKERHUB_USERNAME` unset it is skipped with a notice
  # and the release goes on. Re-pushing a version overwrites its tags, so a re-run is safe.
  publish-image:
    name: publish container image
    needs: [detect, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # provenance attestation
      attestations: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            suffix: ""
          - variant: hosting
            suffix: "-hosting"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub (#1027): pushed only when both secrets are set. The secrets are mapped into the
      # job env once; the token is never echoed. With either unset there is no docker.io tag at all,
      # so nothing can be pushed there, and the release goes on with a notice.
      - name: Resolve the Docker Hub mirror and the image tags
        id: dockerhub
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          tags="ghcr.io/guptasiddhant/storyshelf:${VERSION}${SUFFIX}
          ghcr.io/guptasiddhant/storyshelf:latest${SUFFIX}"
          if [ -n "$DOCKERHUB_TOKEN" ] && [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
            tags="$tags
          docker.io/guptasiddhant/storyshelf:${VERSION}${SUFFIX}
          docker.io/guptasiddhant/storyshelf:latest${SUFFIX}"
          else
            echo "::notice::Docker Hub secrets not set; publishing to ghcr.io only."
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "tags<<TAGS"
            echo "$tags"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server-image/Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.dockerhub.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ needs.detect.outputs.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=image-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.variant }}

  # The tag and the GitHub Release. They follow a successful npm publish and image push, and the tag is what marks
  # the version released: until it exists, every push to main (and a manual re-run) retries the
  # stable path. Both steps tolerate "already exists".
  github-release:
    name: tag and GitHub Release
    needs: [detect, validate, publish-npm, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag through the API and the release
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.detect.outputs.tag }}
      RELEASE_SHA: ${{ needs.detect.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create the tag through the API
        run: |
          set -e
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha 2>/dev/null || true)
          if [ -z "$existing" ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" -f sha="${RELEASE_SHA}"
            echo "created ${RELEASE_TAG} at ${RELEASE_SHA}"
          elif [ "$existing" = "$RELEASE_SHA" ]; then
            echo "${RELEASE_TAG} already exists at this commit"
          else
            echo "::notice::${RELEASE_TAG} already exists at ${existing}; keeping it"
          fi

      - name: Generate release notes
        # CHANGELOG.md is the source of truth: the tag's section in short form (one-line summaries by
        # kind, internal entries counted) with links to the full section and the diff; fall back to
        # the git log when the tag has no section.
        run: |
          set -e
          if node scripts/release-notes.mjs "$RELEASE_TAG" > release-body.md; then
            echo "notes from CHANGELOG.md"
          else
            PREV_TAG=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || echo "")
            echo "no changelog section; git log fallback prev=$PREV_TAG current=$RELEASE_TAG"
            if [ -z "$PREV_TAG" ]; then
              LOG=$(git log --pretty='- %s (%h)' --no-merges)
            else
              LOG=$(git log "$PREV_TAG..${RELEASE_TAG}" --pretty='- %s (%h)' --no-merges)
            fi
            {
              echo "## $RELEASE_TAG"
              echo ""
              echo "$LOG"
            } > release-body.md
          fi
          cat release-body.md

      - name: Create GitHub Release
        # Updates the release when a re-run finds it.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect.outputs.tag }}
          body_path: release-body.md
          generate_release_notes: false

  # The website and the Fly demo follow stable releases only (ADR 0043, amendments 2026-11-10 and
  # 2026-11-11). They run after the tag exists and the image is pushed, so the site builds from the
  # tag and the demo runs the image when it exists. A push to `main` deploys neither.
  website:
    name: website
    needs: [detect, github-release]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/website.yml
    with:
      tag: ${{ needs.detect.outputs.tag }}

  fly:
    name: fly demo
    needs: [detect, github-release]
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/fly.yml
    secrets: inherit
    with:
      version: ${{ needs.detect.outputs.tag }}
