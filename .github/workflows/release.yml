name: Release

# All npm publishing lives in THIS file: the npm trusted publisher of every package is registered
# to this workflow file name (ADR 0043). A run picks one channel (`detect`):
#
# - stable: a push to `main` whose shared version has no `v<version>` tag yet, which is what merging a
#   release pull request (`nub run release:prepare`) produces. Validate, publish `latest` to npm and
#   JSR, create tag `v<version>`, create the GitHub Release.
# - next: any other push to `main` while changesets are pending. A throwaway `x.y.z-next-<sha>`
#   build of every package goes to npm under the `next` dist-tag; the version is never committed.
# - none: nothing to publish.
#
# `workflow_dispatch` (input: version) re-runs the stable path for the version already on `main`
# after a failed publish. Pushing a tag starts nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version already on main whose publish failed (for example 0.9.0)"
        required: true
        type: string

# Read-only by default; each job that writes or publishes states what it needs.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Which channel is this run for? Cheap and dependency-free; also the guard for a manual re-run.
  detect:
    name: detect channel
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.detect.outputs.channel }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      sha: ${{ steps.detect.outputs.sha }} # the release commit: stable jobs publish and tag this, not main's tip
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags decide whether this version was released
          persist-credentials: false

      - name: Detect
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.version }}
        run: node scripts/release-detect.mjs "$EVENT" "$REQUESTED"

  # ---------------------------------------------------------------------------------------------
  # `next` channel
  # ---------------------------------------------------------------------------------------------

  next:
    name: publish next
    needs: [detect]
    if: needs.detect.outputs.channel == 'next'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore provenance + npm trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Nub
        uses: nubjs/setup-nub@v0

      - name: Check npm version for OIDC
        run: node scripts/check-npm-oidc.mjs

      - name: Install dependencies
        run: nub ci

      - name: Version a snapshot (working tree only, never committed)
        # `x.y.z-next-<sha>`: the version the pending changesets calculate, plus a suffix.
        run: node scripts/version-packages.mjs --snapshot

      - name: Validate the snapshot
        id: guard
        run: node scripts/release-validate.mjs --tree

      - name: Build packages
        run: nub run build --filter='./packages/*'

      - name: Rewrite workspace protocol for npm manifest
        run: node scripts/rewrite-workspace-protocol.mjs

      - name: Publish to npm under the next tag (trusted / provenance)
        run: node scripts/publish-npm.mjs "${{ steps.guard.outputs.version }}" next

  # ---------------------------------------------------------------------------------------------
  # Stable channel (a merged release pull request)
  # ---------------------------------------------------------------------------------------------

  # Version gate: single source of truth. Both publishers depend on this job (not on each other),
  # so a bad tree fails fast before either registry is touched, while npm and JSR never block each
  # other.
  validate:
    name: validate release
    needs: [detect]
    if: needs.detect.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.guard.outputs.version }}
      dist_tag: ${{ steps.guard.outputs.dist_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Guard the fixed versions
        id: guard
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: node scripts/release-validate.mjs "$TAG"

  # npm publish. Skips versions already on npm, so a re-run resumes.
  publish-npm:
    needs: [detect, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore provenance + npm trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Nub
        uses: nubjs/setup-nub@v0

      - name: Check npm version for OIDC
        # Before install: no project-state dependency, fails fast on a bad
        # toolchain. After Setup Nub so the tested npm is the publishing one.
        run: node scripts/check-npm-oidc.mjs

      - name: Install dependencies
        run: nub ci

      - name: Build packages
        # Not strictly required (prepublishOnly runs build), but fail-fast before provenance.
        run: nub run build --filter='./packages/*'

      - name: Rewrite workspace protocol for npm manifest
        # Plain npm publish ships dependencies verbatim, so workspace:* must become caret ranges.
        # Repo files keep workspace:*; only this CI working tree is rewritten.
        run: node scripts/rewrite-workspace-protocol.mjs

      - name: Publish to npm (trusted / provenance)
        # OIDC trusted publishing: npm exchanges the workflow OIDC token automatically, no
        # NODE_AUTH_TOKEN. Requires a trusted publisher per package on npmjs.com (one-time).
        run: node scripts/publish-npm.mjs "${{ needs.validate.outputs.version }}" "${{ needs.validate.outputs.dist_tag }}"

  # The tag and the GitHub Release. They follow a successful npm publish, and the tag is what marks
  # the version released: until it exists, every push to main (and a manual re-run) retries the
  # stable path. A JSR failure does not hold them back. Both steps tolerate "already exists".
  github-release:
    name: tag and GitHub Release
    needs: [detect, validate, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag through the API and the release
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.detect.outputs.tag }}
      RELEASE_SHA: ${{ needs.detect.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create the tag through the API
        run: |
          set -e
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha 2>/dev/null || true)
          if [ -z "$existing" ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" -f sha="${RELEASE_SHA}"
            echo "created ${RELEASE_TAG} at ${RELEASE_SHA}"
          elif [ "$existing" = "$RELEASE_SHA" ]; then
            echo "${RELEASE_TAG} already exists at this commit"
          else
            echo "::notice::${RELEASE_TAG} already exists at ${existing}; keeping it"
          fi

      - name: Generate release notes
        # CHANGELOG.md is the source of truth (minor releases roll up the previous minor line);
        # fall back to the git log when the tag has no section.
        run: |
          set -e
          if node scripts/release-notes.mjs "$RELEASE_TAG" > release-body.md; then
            echo "notes from CHANGELOG.md"
          else
            PREV_TAG=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || echo "")
            echo "no changelog section; git log fallback prev=$PREV_TAG current=$RELEASE_TAG"
            if [ -z "$PREV_TAG" ]; then
              LOG=$(git log --pretty='- %s (%h)' --no-merges)
            else
              LOG=$(git log "$PREV_TAG..${RELEASE_TAG}" --pretty='- %s (%h)' --no-merges)
            fi
            {
              echo "## $RELEASE_TAG"
              echo ""
              echo "$LOG"
            } > release-body.md
          fi
          cat release-body.md

      - name: Create GitHub Release
        # Updates the release when a re-run finds it.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect.outputs.tag }}
          body_path: release-body.md
          generate_release_notes: false

  # JSR publish. Depends on validate, independent of npm: `continue-on-error` means a failure here
  # never fails the workflow or blocks publish-npm. A re-run publishes only what JSR lacks.
  publish-jsr:
    needs: [detect, validate]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # OIDC: JSR authenticates publish + attaches provenance, no token
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Nub
        uses: nubjs/setup-nub@v0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.6.7

      - name: Install dependencies
        run: nub ci

      - name: Build packages (regenerates deno.json with current version)
        run: nub run build --filter='./packages/*'

      - name: "Rewrite workspace protocol for JSR manifest"
        # Same rewrite as the npm job; --allow-dirty tolerates it at publish.
        run: node scripts/rewrite-workspace-protocol.mjs

      - name: "Publish to JSR (dependency order: core first)"
        # deno publish directly (no npx jsr wrapper): the wrapper re-downloads itself and its deno
        # binary per package (~5 min each). Pinned deno via Setup Deno makes every package publish
        # in seconds.
        run: node scripts/publish-jsr.mjs
