name: Vite+ retest (#907)

# DO NOT MERGE. Times turbo (main's toolchain, restored over this tree) and Vite+ on the same commit,
# the same runner type and the same task set (website excluded on both), at each tool's default
# concurrency, then ports the CI jobs the first spike skipped.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vp-spike-${{ github.ref }}
  cancel-in-progress: false

env:
  MIGRATION_SHA: a9073913d4e13ae5fb7529e4914ecfe3d9daa205

jobs:
  turbo:
    name: turbo (timings)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore main's toolchain files (nub + turbo on the same sources)
        run: |
          git diff --name-status "$MIGRATION_SHA^" "$MIGRATION_SHA" | while IFS=$'\t' read -r st path; do
            if [ "$st" = "A" ]; then git rm -rqf --ignore-unmatch -- "$path"; else git checkout origin/main -- "$path" 2>/dev/null || git checkout "$MIGRATION_SHA^" -- "$path"; fi
          done
          grep -rlE "vite-plus/test" --include='*.ts' --include='*.tsx' packages apps scripts 2>/dev/null | grep -v node_modules | xargs -r sed -i 's#"vite-plus/test"#"vitest"#g'
          git status --short | wc -l
      - uses: ./.github/actions/setup-workspace
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.x", terraform_wrapper: false }
      - name: Time turbo
        env: { RUN_TERRAFORM: "1" }
        run: bash scripts/spike-time.sh turbo
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: turbo-logs
          path: |
            .tmp/logs
            .tmp/times.tsv

  vp:
    name: vp (timings)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vp-spike
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.x", terraform_wrapper: false }
      - name: Time vp
        env: { RUN_TERRAFORM: "1" }
        run: bash scripts/spike-time.sh vp
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: vp-logs
          path: |
            .tmp/logs
            .tmp/times.tsv

  lint-files:
    name: vp (lint:files port)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vp-spike
      - name: check-files unit test
        run: node --test scripts/check-files.test.mjs
      - name: vp check (oxfmt + oxlint over every tracked file)
        run: |
          s=$(date +%s); vp check --continue-on-error 2>&1 | tail -n 15; code=${PIPESTATUS[0]}
          echo "vp check: $(( $(date +%s) - s ))s, exit $code" >> "$GITHUB_STEP_SUMMARY"; exit $code

  storybook-dev:
    name: vp (storybook-dev port)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vp-spike
      - name: Build the packages the app's Storybook imports
        run: vp run -F '@storyshelf/app^...' build
      - name: Open every story in the Storybook dev server
        working-directory: packages/app
        env: { STORYBOOK_SMOKE_BROWSER_CHANNEL: chrome }
        run: pnpm run smoke:storybook

  postgres-lifecycle:
    name: vp (postgres-lifecycle port)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test-password, POSTGRES_DB: storyshelf_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d storyshelf_test"
          --health-interval=10s --health-timeout=5s --health-retries=12
      wsproxy:
        image: ghcr.io/neondatabase/wsproxy:latest
        env: { APPEND_PORT: "postgres:5432", ALLOW_ADDR_REGEX: ".*", LOG_TRAFFIC: "false" }
        ports: ["5433:80"]
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-vp-spike
      - name: Build the packages the adapter imports
        run: vp run -F '@storyshelf/db-postgres^...' build
      - name: Build-reference contract against real Postgres
        working-directory: packages/db-postgres
        env:
          LIVE_CLOUD: "1"
          POSTGRES_SCHEMA_MUTATION_TEST: "1"
          DATABASE_URL: postgres://postgres:test-password@127.0.0.1:5432/storyshelf_test
          NEON_WSPROXY: 127.0.0.1:5433/v1
        run: |
          vp test run src/build-reference-lifecycle.test.ts
          vp test run src/retention-activation.test.ts
          vp test run src/retention-pool-presets.test.ts

  website:
    name: "vp (website build, links, a11y)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vp-spike
      - name: Build, then link check
        working-directory: apps/website
        run: |
          s=$(date +%s); vp run build; echo "website build: $(( $(date +%s) - s ))s" >> "$GITHUB_STEP_SUMMARY"
          pnpm run check:links
      - name: Accessibility (axe, light/dark/mobile)
        working-directory: apps/website
        env: { A11Y_BROWSER_CHANNEL: chrome }
        run: pnpm run check:a11y
