# Sample workflow for building and deploying an Astro site to GitHub Pages
#
# To get started with Astro see: https://docs.astro.build/en/getting-started/
#
name: Deploy Astro site to Pages

# The site shows the latest stable release only (ADR 0043, amendments 2026-11-10 and 2026-11-11).
# A push to `main` deploys nothing: `release.yml` calls this workflow after a stable release is
# tagged, and `workflow_dispatch` rebuilds on demand. A website PR is still built and link-checked
# by ci.yml, and its docs reach the site with the next release.
on:
  workflow_call:
    inputs:
      tag:
        description: "The release tag to build (for example v0.12.0). Empty: the latest stable tag."
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build (for example v0.12.0). Empty: the latest stable tag."
        required: false
        default: ""
        type: string

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_PATH: apps/website

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Only to read the tags: the site is built from the tag checked out below.
      - name: Checkout (tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the release tag
        id: release
        env:
          REQUESTED: ${{ inputs.tag }}
        run: |
          set -e
          if [ -n "$REQUESTED" ]; then
            tag="$REQUESTED"
          else
            # Latest stable tag: vX.Y.Z only, never a pre-release.
            tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -Ev -- '-' | head -n 1)
          fi
          if ! git rev-parse -q --verify "refs/tags/${tag}^{commit}" >/dev/null; then
            echo "::error::No release tag found (${tag:-none}); nothing to build."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Building the site from ${tag}" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout the release
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0 # full history so "last updated" dates are accurate
          persist-credentials: false
      - name: Setup Nub
        uses: nubjs/setup-nub@v0
        with:
          # Pinned (#782, now 0.10.0): exact, so no job drifts to a new nub. protobufjs's build script is denied in package.json `allowScripts`.
          nub-version: "0.10.0"
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: nub ci
      - name: Build with Astro
        working-directory: ${{ env.BUILD_PATH }}
        run: |
          nub run build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"
      - name: Check for broken links
        working-directory: ${{ env.BUILD_PATH }}
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: nub run check:links
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
