# fly.toml app configuration file generated for storyshelf on 2026-08-30T20:57:15Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'storyshelf'
primary_region = 'iad'

[build]
dockerfile = 'Dockerfile'

[env]
SHELF_DATA_DIR = '/data'
# 1 GB VM: cap the Node heap so Chromium keeps the rest.
NODE_OPTIONS = '--max-old-space-size=384'
PORT = '3000'
# Daily purge of builds older than 14 days (baselines and pinned builds are kept; ADR 0039).
SHELF_PURGE_TTL_DAYS = '14'
SHELF_PUBLIC_BASE_URL = 'https://storyshelf.fly.dev'
# The demo's one published read-only account (#1275, #1274). Its password is the Fly secret
# SHELF_DEMO_VIEWER_PASSWORD (set by the owner; never put it here).
SHELF_READ_ONLY_ACCOUNTS = 'demo@storyshelf.js.org'
SHELF_AUTH_HELP_TEXT = "Demo: sign in as demo@storyshelf.js.org (read-only). The password is on the website's demo page."

[[mounts]]
source = 'storyshelf_data'
destination = '/data'

[http_service]
internal_port = 3000
force_https = true
# Always on: captures run in the background, after the upload's request has ended. Fly's auto-stop
# looks only at HTTP traffic, so a stopped machine killed captures mid-run and left their jobs
# leased until the next request woke it (owner, 2026-11-17).
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
type = 'http'
path = '/api/v1/health'
interval = '30s'
timeout = '5s'

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1
memory_mb = 1024
