<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="StoryShelf">
  <title>StoryShelf</title>
  <!-- An S-shaped shelf whose boards run to the edge of the tile; three unchanged stories (outlined) and one changed story (solid, top right). Each story is a rounded rectangle lowered into its board; its top corners are concentric with the S bend (gap 3, radius 5.5 - 3 = 2.5). -->
  <rect width="64" height="64" fill="#000000"/>
  <g>
    <path d="M64 13.5 H22.5 a8 8 0 0 0 -8 8 V32 H49.5 V42.5 a8 8 0 0 1 -8 8 H0" fill="none" stroke="#ffffff" stroke-width="5"/>
    <rect x="20.75" y="19.75" width="7.75" height="10.5" rx="1.75" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="32.25" y="19" width="9.25" height="12" rx="2.5" fill="#ffffff"/>
    <rect x="20.75" y="38.25" width="7.75" height="10.5" rx="1.75" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="33" y="38.25" width="7.75" height="10.5" rx="1.75" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  </g>
</svg>
