<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="StoryShelf">
  <title>StoryShelf</title>
  <!-- The maskable icon: the purple-white mark scaled to 80 % (the manifest safe zone) on a full-bleed square tile. The boards are drawn past the tile on both sides, so after the scale they still reach the edge, wherever a mask cuts. -->
