    <rect x="11.63" y="4" width="2.5" height="9" rx="0.4" transform="rotate(-17 11.63 13)" fill="#cbc2ff"/>
    <rect x="1" y="13" width="14" height="2" rx="0.4" fill="#ffffff"/>
  </g>
</svg>
