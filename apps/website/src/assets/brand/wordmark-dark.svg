<svg xmlns="http://www.w3.org/2000/svg" width="168" height="32" viewBox="0 0 168 32" role="img" aria-label="StoryShelf">
  <!-- StoryShelf mark: a shelf with three books; the last one leans on its neighbour (the changed one). Hand-written; see docs/brand.md. -->
  <g transform="translate(0 1) scale(1.75)">
    <rect x="2" y="6" width="3" height="7" rx="0.4" fill="#fafafa"/>
    <rect x="6" y="3" width="3" height="10" rx="0.4" fill="#fafafa"/>
    <rect x="11.63" y="4" width="2.5" height="9" rx="0.4" transform="rotate(-17 11.63 13)" fill="#9d8cff"/>
    <rect x="1" y="13" width="14" height="2" rx="0.4" fill="#fafafa"/>
  </g>
  <text x="36" y="22.5" fill="#fafafa" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="-0.2">StoryShelf</text>
</svg>
