# fly.toml app configuration file generated for storyshelf on 2026-08-30T20:57:15Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'storyshelf'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  PORT = '3000'

[[mounts]]
  source = 'storyshelf_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
